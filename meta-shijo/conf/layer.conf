# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-shijo"
BBFILE_PATTERN_meta-shijo = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-shijo = "6"

LAYERDEPENDS_meta-shijo = "core"
LAYERSERIES_COMPAT_meta-shijo = "wrynose"
